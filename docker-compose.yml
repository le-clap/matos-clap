# Stack locale : fait tourner l'image de production sur une BDD jetable.
# Le SSO ne redirigeant pas vers localhost, le bypass de connexion est activé.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: matos_clap
      POSTGRES_USER: matos_clap
      POSTGRES_PASSWORD: matos_clap
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_ENABLE_DEV_LOGIN: "true"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: matos_clap
      DB_USER: matos_clap
      DB_PASSWORD: matos_clap
      ENABLE_DEV_LOGIN: "true"
    volumes:
      - backend-data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  backend-data:
  db-data:
