[project]
name = "matos-clap-backend"
version = "1.1.0"
description = "Backend for the Matos CLAP project."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "fastapi-cli>=0.0.33",
    "python-multipart>=0.0.33",
    "httpx2>=2.0.0",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "psycopg2-binary>=2.9.13",
    "sqlmodel>=0.0.49",
    "uvicorn[standard]>=0.54.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-sugar>=1.1.1",
    "pytest-env>=1.8.5",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env = ["ENV=development"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() in FastAPI is standard

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "models", "routers", "schemas"]
