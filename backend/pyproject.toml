[project]
name = "matos-clap-backend"
version = "1.0.2"
description = "Backend for the Matos CLAP project."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "psycopg2-binary>=2.9.13",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
    "pytest-env>=1.7.1",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env = ["ENV=development"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() in FastAPI is standard

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "models", "routers", "schemas"]
