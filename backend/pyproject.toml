[project]
name = "matos-clap-backend"
version = "1.0.0"
description = "Backend for the Matos CLAP project."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "psycopg2-binary>=2.9.12",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.56",
    "pre-commit>=4.6.0",
    "pytest>=8.3",
    "pytest-sugar>=1.0",
    "pytest-env>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env = ["ENV=development"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() in FastAPI is standard

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "models", "routers", "schemas"]
